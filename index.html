<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Stream & Action Hub</title>

<!-- Підключення маніфесту та кольору теми -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3f6f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Замінено зовнішні шрифти на системні для повної автономності */
:root{
  --bg:#eef1f4;--panel:#f8f9fb;--ink:#1d2733;--mute:#66758a;--line:#d9dfe6;--accent:#3f6f8f;--accent-ink:#fff;
  --low:#4f8a6a;--mid:#b08a2e;--high:#8a5a8f;--chip:#e3e9ef;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --read:Georgia,Cambria,"Times New Roman",Times,serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d;--panel:#1a212a;--ink:#e4e9ef;--mute:#8d9bae;--line:#2b3542;--accent:#7fb0cf;--accent-ink:#0f1a22;
  --low:#6fb48e;--mid:#d1ad55;--high:#b98bbf;--chip:#232c37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--panel:#1a212a;--ink:#e4e9ef;--mute:#8d9bae;--line:#2b3542;--accent:#7fb0cf;--accent-ink:#0f1a22;
  --low:#6fb48e;--mid:#d1ad55;--high:#b98bbf;--chip:#232c37;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:var(--read);font-size:19px;font-weight:500}
.energy{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:999px}
.energy button{padding:5px 12px;border-radius:999px;color:var(--mute);font-size:14px}
.energy button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.search{flex:1 1 200px;max-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.search::placeholder{color:var(--mute)}
.omni{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 16px;margin-bottom:6px}
.omni:focus-within{border-color:var(--accent)}
.kind-select{background:var(--chip);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;border-radius:8px;padding:6px 10px;cursor:pointer;outline:none}
.kind-select:focus-visible{border-color:var(--accent)}
.omni.task .kind{color:var(--accent)}
.omni input{flex:1;background:none;border:0;outline:0;padding:10px 0;font-size:16px;min-width:0}
.omni button{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-weight:500}
.omni button:disabled{opacity:.35;cursor:default}
.hint{color:var(--mute);font-size:13px;margin:0 4px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
h2{margin:0 0 10px;font-size:15px;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tabs button{padding:4px 11px;border-radius:999px;color:var(--mute);font-size:14px;border:1px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--chip)}
.card{border-top:1px solid var(--line);padding:12px 2px}
.card:first-of-type{border-top:0}
.thought p{margin:0 0 8px;font-family:var(--read);font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--mute)}
.tag{background:var(--chip);border-radius:999px;padding:1px 9px;color:var(--mute)}
.tag:hover{color:var(--ink)}
.act{color:var(--accent);font-size:13px}
.act:hover{text-decoration:underline}
.sp{flex:1}
.task .row{display:flex;gap:10px;align-items:flex-start}
.check{flex:none;width:20px;height:20px;border:1.5px solid var(--mute);border-radius:6px;margin-top:2px;display:grid;place-items:center;font-size:13px;line-height:1}
.done>.row .check{background:var(--low);border-color:var(--low);color:#fff}
.ttl{flex:1;text-align:left;font-weight:500;overflow-wrap:anywhere}
.done .ttl{text-decoration:line-through;color:var(--mute)}
.badge{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.LOW{color:var(--low)}.MEDIUM{color:var(--mid)}.HIGH{color:var(--high)}
.prog{font-size:12px;color:var(--mute)}
.detail{margin:10px 0 2px 30px;display:grid;gap:8px}
.cfg{display:grid;gap:8px;margin-top:10px}
.cfg textarea,.cfg input[type=text],.cfg select,.detail textarea,.detail input[type=text],.detail select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
.detail textarea{resize:vertical;min-height:54px}
.sub{display:flex;gap:8px;align-items:center}
.sub input[type=checkbox]{accent-color:var(--accent)}
.sub.d span{text-decoration:line-through;color:var(--mute)}
.sub .x{margin-left:auto;color:var(--mute)}
.pair{display:flex;gap:8px;flex-wrap:wrap}
.pair select{width:auto;flex:1}
.empty{color:var(--mute);padding:18px 4px;font-size:14px}
details summary{cursor:pointer;color:var(--mute);font-size:14px;padding:10px 2px}
.note{color:var(--mute);font-size:13px;margin:0 0 8px}
.task .row{flex-wrap:wrap}
.mv{flex:none;white-space:nowrap;margin-top:2px}
.del{flex:none;color:var(--mute);font-size:16px;line-height:1;padding:2px 4px;border-radius:6px}
.del:hover{color:#c62828;background:var(--chip)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.deadline-badge { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--mute); display: inline-flex; align-items: center; gap: 4px; }
.deadline-badge.overdue { background: #ffebee; color: #c62828; font-weight: 600; border: 1px solid #ef9a9a; }
.deadline-badge.today { background: #fff8e1; color: #b78103; font-weight: 500; border: 1px solid #ffe082; }
.quick-dates { display: flex; gap: 6px; margin: 4px 0 10px; flex-wrap: wrap; }
.quick-dates button { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--chip); color: var(--ink); }
.quick-dates button:hover { background: var(--line); }
.due-input { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.header-left { display: flex; align-items: center; gap: 12px; }
.burger-btn { display: flex; flex-direction: column; justify-content: space-around; width: 24px; height: 20px; padding: 2px 0; }
.burger-btn span { display: block; width: 100%; height: 2.5px; background: var(--ink); border-radius: 4px; }
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; visibility: hidden; transition: 0.25s ease; z-index: 99; }
.sidebar-overlay.active { opacity: 1; visibility: visible; }
.sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: var(--panel); border-right: 1px solid var(--line); box-shadow: 4px 0 20px rgba(0,0,0,0.15); transition: left 0.25s cubic-bezier(0.4,0,0.2,1); z-index: 100; display: flex; flex-direction: column; padding: 20px 16px; }
.sidebar.active { left: 0; }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.sidebar-header h3 { margin: 0; font-size: 16px; font-weight: 600; }
.sidebar-close { font-size: 22px; color: var(--mute); padding: 4px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
.sidebar-nav button { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; text-align: left; font-size: 15px; font-weight: 500; color: var(--mute); transition: 0.15s; }
.sidebar-nav button:hover, .sidebar-nav button.active { background: var(--chip); color: var(--ink); }
.sidebar-nav button.active { font-weight: 600; }
.page-section { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.page-section.active { display: block; }
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="sidebar-overlay" id="s-overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>Розділи</h3>
    <button class="sidebar-close" id="s-close">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <button data-view="tasks" class="active">⚡ Фокус дій</button>
    <button data-view="thoughts">💭 Потік думок</button>
    <button data-view="courses">📚 Курси</button>
  </nav>
</aside>
<div class="wrap">
  <header>
    <div class="header-left">
      <button class="burger-btn" id="s-open" aria-label="Відкрити меню">
        <span></span><span></span><span></span>
      </button>
      <div class="logo">Mind Stream &amp; Action Hub</div>
    </div>
    <div class="energy" role="group" aria-label="Мій стан">
      <button data-e="fresh">🟢 Свіжий</button><button data-e="norm">🟡 Норм</button><button data-e="tired">🔴 Втомлений</button>
    </div>
    <input id="q" class="search" type="search" placeholder="Пошук (Ctrl+K)" aria-label="Пошук">
  </header>

  <form id="omni" class="omni">
    <select id="kind-select" class="kind-select" aria-label="Тип запису">
      <option value="TASK">⚡ Задача</option>
      <option value="THOUGHT">💭 Думка</option>
      <option value="COURSE">📚 Курс</option>
    </select>
    <input id="inp" autocomplete="off" autofocus placeholder="Введіть текст…" aria-label="Текст запису">
    <button type="submit" id="go" disabled>Зберегти</button>
  </form>
  <p class="hint">Оберіть тип у шторці зліва та введіть текст. Теги: #ідея #робота. Для задач: !low !mid !high.</p>
  <div class="quick-dates" id="due-quick-bar">
    <span style="font-size:12px;color:var(--mute);align-self:center;">Термін:</span>
    <button type="button" data-setdue="today">Сьогодні</button>
    <button type="button" data-setdue="tomorrow">На завтра</button>
    <button type="button" data-setdue="clear">✕ Без терміну</button>
    <input type="datetime-local" id="inp-due" class="due-input" aria-label="Вказати точний термін">
  </div>
  <main>
    <section class="page-section active" id="sec-tasks" aria-labelledby="h2">
      <h2 id="h2">Фокус дій</h2>
      <div class="tabs" id="htabs"></div>
      <div id="tasks"></div>
    </section>
    <section class="page-section" id="sec-thoughts" aria-labelledby="h1">
      <h2 id="h1">Потік думок</h2>
      <div class="tabs" id="ttabs"></div>
      <div id="thoughts"></div>
    </section>
    <section class="page-section" id="sec-courses" aria-labelledby="h3">
      <h2 id="h3">Курси</h2>
      <div class="tabs" id="ctabs"></div>
      <div id="courses"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var LIMIT=Infinity, KEY='mshub.v1';
var E_LABEL={LOW:'Легка',MEDIUM:'Середня',HIGH:'Глибокий фокус'};
var H_LABEL={TODAY:'Сьогодні',THIS_WEEK:'Цей тиждень',LATER:'Пізніше',WAITING:'Очікую'};
var S_ALLOWED={fresh:['LOW','MEDIUM','HIGH'],norm:['LOW','MEDIUM'],tired:['LOW']};
var state={thoughts:[],tasks:[],courses:[],energy:'fresh'};
var ui={tTab:'all',hTab:'TODAY',cTab:'ACTIVE',tag:null,q:'',open:{},cfg:null,tSort:'desc',doneOpen:false};

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.thoughts&&d.tasks)state=Object.assign(state,d);if(!state.courses)state.courses=[]}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var $=function(id){return document.getElementById(id)};
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},3200)}

var sidebar=$('sidebar'),overlay=$('s-overlay'),kSel=$('kind-select'),inp=$('inp'),form=$('omni');
function setSidebar(open){sidebar.classList.toggle('active',open);overlay.classList.toggle('active',open)}
$('s-open').addEventListener('click',function(){setSidebar(true)});
$('s-close').addEventListener('click',function(){setSidebar(false)});
overlay.addEventListener('click',function(){setSidebar(false)});

function switchView(viewName){
  document.querySelectorAll('.sidebar-nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===viewName)});
  document.querySelectorAll('.page-section').forEach(function(sec){sec.classList.remove('active')});
  var activeSec=$('sec-'+viewName);
  if(activeSec)activeSec.classList.add('active');
  if(viewName==='tasks')kSel.value='TASK';
  else if(viewName==='thoughts')kSel.value='THOUGHT';
  else if(viewName==='courses')kSel.value='COURSE';
  updatePlaceholder();
}

document.querySelectorAll('.sidebar-nav button').forEach(function(btn){
  btn.addEventListener('click',function(){switchView(btn.dataset.view);setSidebar(false)});
});

function normTags(a){var s={};a.forEach(function(t){t=t.trim().toLowerCase();if(t)s[t]=1});return Object.keys(s)}
function activeToday(){return state.tasks.filter(function(t){return t.horizon==='TODAY'&&(t.status==='TODO'||t.status==='IN_PROGRESS')}).length}
function pickHorizon(want){
  if(want==='TODAY'&&activeToday()>=LIMIT){toast('На сьогодні вже '+LIMIT+' фокусних справ — задачу перенесено на тиждень');return'THIS_WEEK'}
  return want;
}
function addTask(o){
  var t={id:uid(),title:o.title,description:o.description||'',status:'TODO',horizon:pickHorizon(o.horizon||'TODAY'),energy:o.energy||'MEDIUM',dueDate:o.dueDate||null,completedAt:null,originThoughtId:o.originThoughtId||null,subtasks:[],tags:normTags(o.tags||[]),createdAt:Date.now()};
  state.tasks.unshift(t);return t;
}
function addCourse(o){
  var c={id:uid(),title:o.title,status:'ACTIVE',modules:[],tags:normTags(o.tags||[]),createdAt:Date.now()};
  state.courses.unshift(c);return c;
}
function convertThought(i){
  if(!i||!i.thoughtId)return{success:false,error:'ID думки обов’язковий'};
  var th=state.thoughts.find(function(x){return x.id===i.thoughtId});
  if(!th)return{success:false,error:'Думку не знайдено'};
  if(th.convertedTaskId&&state.tasks.some(function(x){return x.id===th.convertedTaskId}))return{success:false,error:'Ця думка вже була перетворена на задачу'};
  var title=(i.customTitle||th.content).trim();
  if(!title)return{success:false,error:'Текст для задачі не може бути порожнім'};
  var desc=i.description!==undefined?i.description:(i.customTitle&&i.customTitle.trim()!==th.content.trim()?th.content:'');
  var t=addTask({title:title,description:desc,energy:i.energy||'MEDIUM',horizon:i.horizon||'TODAY',tags:th.tags,originThoughtId:th.id});
  th.convertedTaskId=t.id;
  if(i.archiveThought!==false)th.isArchived=true;
  save();return{success:true,taskId:t.id};
}

function updatePlaceholder(){
  var val=kSel.value;
  if(val==='THOUGHT')inp.placeholder='Запишіть нову думку чи ідею…';
  if(val==='TASK')inp.placeholder='Що треба зробити? (можна додати !low, !mid, !high)…';
  if(val==='COURSE')inp.placeholder='Назва нового курсу чи книги…';
}
function preview(){$('go').disabled=!inp.value.trim()}

kSel.addEventListener('change',function(){
  updatePlaceholder();
  if(kSel.value==='TASK')switchView('tasks');
  else if(kSel.value==='THOUGHT')switchView('thoughts');
  else if(kSel.value==='COURSE')switchView('courses');
});
inp.addEventListener('input',preview);

function fmt(ts){return new Date(ts).toLocaleDateString('uk-UA',{day:'2-digit',month:'short'})}
function fmtDue(isoStr){
  if(!isoStr)return'';
  var d=new Date(isoStr),now=new Date(),isOver=d<now,isToday=d.toDateString()===now.toDateString();
  var time=d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
  var date=d.toLocaleDateString('uk-UA',{day:'2-digit',month:'short'});
  var cls=isOver?'overdue':(isToday?'today':'');
  var text=(isToday?'Сьогодні':date)+' '+time;
  return '<span class="deadline-badge '+cls+'">🕒 '+text+(isOver?' (Прострочено)':'')+'</span>';
}

form.addEventListener('submit',function(e){
  e.preventDefault();
  var raw=inp.value.trim();if(!raw)return;
  var type=kSel.value,energy='MEDIUM';
  var m=raw.match(/(^|\s)!(low|mid|high)(?=\s|$)/i);
  if(m){energy={low:'LOW',mid:'MEDIUM',high:'HIGH'}[m[2].toLowerCase()];raw=raw.replace(/(^|\s)!(low|mid|high)(?=\s|$)/gi,' ')}
  var tags=[];
  var words=raw.split(/\s+/).filter(function(w){if(w.charAt(0)==='#'&&w.length>1){tags.push(w.slice(1));return false}return true});
  var title=words.join(' ').trim();if(!title)return;

  if(type==='TASK'){
    var dueVal=$('inp-due').value||null;
    addTask({title:title,energy:energy,tags:tags,dueDate:dueVal});
    $('inp-due').value='';toast('Задачу збережено');switchView('tasks');
  }else if(type==='COURSE'){
    addCourse({title:title,tags:tags});toast('Курс створено');switchView('courses');
  }else{
    state.thoughts.unshift({id:uid(),content:title,isArchived:false,createdAt:Date.now(),convertedTaskId:null,tags:normTags(tags)});
    toast('Думку збережено');switchView('thoughts');
  }
  inp.value='';preview();save();render();
});

window.addEventListener('keydown',function(e){
  var tag=(document.activeElement||{}).tagName;
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(tag)){e.preventDefault();inp.focus()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('q').focus()}
  if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';ui.q='';render();inp.focus()}
});
$('q').addEventListener('input',function(e){ui.q=e.target.value.trim().toLowerCase();render()});
document.querySelector('.energy').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.energy=b.dataset.e;save();render()});

function matchQ(text,tags){
  if(ui.tag&&tags.indexOf(ui.tag)<0)return false;
  if(!ui.q)return true;
  return(text.toLowerCase().indexOf(ui.q)>=0)||tags.some(function(t){return t.indexOf(ui.q.replace(/^#/,''))>=0});
}
function tabsHtml(list,cur,attr){return list.map(function(x){return '<button '+attr+'="'+x[0]+'" aria-pressed="'+(x[0]===cur)+'">'+x[1]+'</button>'}).join('')}
function opts(map,cur){return Object.keys(map).map(function(k){return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+map[k]+'</option>'}).join('')}
function cfgHtml(t){
  return '<div class="cfg"><input type="text" data-c="title" value="'+esc(t.content.split('\n')[0].slice(0,120))+'" aria-label="Назва задачі">'+
    '<textarea data-c="desc" placeholder="Опис. Якщо порожньо й назву змінено — візьметься текст думки"></textarea>'+
    '<div class="pair"><select data-c="en" aria-label="Енергія">'+opts(E_LABEL,'MEDIUM')+'</select><select data-c="hor" aria-label="Горизонт">'+opts(H_LABEL,'TODAY')+'</select></div>'+
    '<label class="sub"><input type="checkbox" data-c="arch" checked> Архівувати думку після конвертації</label>'+
    '<div class="meta"><span class="sp"></span><button type="button" class="act" data-cancel="1">Скасувати</button><button type="button" class="act" data-cok="1">Створити задачу</button></div></div>';
}

function renderThoughts(){
  var tabs=[['all','Всі'],['ідея','Ідеї'],['рефлексія','Рефлексії'],['none','Несортоване'],['archive','Архів']];
  var h=tabsHtml(tabs,ui.tTab,'data-tt');
  if(ui.tag)h+='<button data-clear="1" class="tag">#'+esc(ui.tag)+' ✕</button>';
  var sortLabel=ui.tSort==='desc'?'⏳ Спочатку нові':'⌛ Спочатку старі';
  h+='<button data-tsort="1" class="tag" style="margin-left:auto">'+sortLabel+'</button>';
  if(ui.tTab==='archive'){h+='<button data-clrarch="1" class="tag" style="color:#c62828">🗑 Очистити архів</button>'}
  $('ttabs').innerHTML=h;

  var list=state.thoughts.filter(function(t){
    if(ui.tTab==='archive')return t.isArchived;
    if(t.isArchived)return false;
    if(ui.tTab==='ідея'||ui.tTab==='рефлексія')return t.tags.indexOf(ui.tTab)>=0;
    if(ui.tTab==='none')return t.tags.length===0;
    return true;
  }).filter(function(t){return matchQ(t.content,t.tags)});

  list.sort(function(a,b){return ui.tSort==='desc'?(b.createdAt-a.createdAt):(a.createdAt-b.createdAt)});
  if(!list.length){$('thoughts').innerHTML='<div class="empty">'+(state.thoughts.length?'Тут нічого не знайдено.':'Поки тихо. Напиши першу думку в поле вгорі.')+'</div>';return}
  $('thoughts').innerHTML=list.map(function(t){
    var conv=t.convertedTaskId&&state.tasks.some(function(x){return x.id===t.convertedTaskId});
    var isIdea=t.tags.indexOf('ідея')>=0,isReflect=t.tags.indexOf('рефлексія')>=0;
    return '<div class="card thought" data-id="'+t.id+'"><p>'+esc(t.content)+'</p><div class="meta"><span>'+fmt(t.createdAt)+'</span>'+
      t.tags.map(function(g){return '<button class="tag" data-tag="'+esc(g)+'">#'+esc(g)+'</button>'}).join('')+
      '<span class="sp"></span>'+
      '<button class="act" data-moveto="ідея" style="font-weight:'+(isIdea?'bold':'normal')+'">'+(isIdea?'✓ В ідеях':'→ В ідеї')+'</button>'+
      '<button class="act" data-moveto="рефлексія" style="font-weight:'+(isReflect?'bold':'normal')+'">'+(isReflect?'✓ В рефлексіях':'→ В рефлексії')+'</button>'+
      (conv?'<button class="act" data-goto="'+t.convertedTaskId+'">✓ Вже в задачах ↗</button>':(t.isArchived?'':'<button class="act" data-conv="1">У задачу</button><button class="act" data-cfg="1">Налаштувати</button>'))+
      '<button class="act" data-arch="1">'+(t.isArchived?'Повернути':'В архів')+'</button></div>'+(ui.cfg===t.id&&!conv?cfgHtml(t):'')+'</div>';
  }).join('');
}

function renderTasks(){
  var tabs=[['TODAY','Сьогодні'],['THIS_WEEK','Тиждень'],['ALL','Всі']];
  $('htabs').innerHTML=tabsHtml(tabs,ui.hTab,'data-ht');
  document.querySelectorAll('.energy button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.e===state.energy)});
  var allowed=S_ALLOWED[state.energy];
  var base=state.tasks.filter(function(t){return(t.status==='TODO'||t.status==='IN_PROGRESS')&&matchQ(t.title+' '+t.description,t.tags)});
  var byH=base.filter(function(t){return ui.hTab==='ALL'||t.horizon===ui.hTab});
  var list=byH.filter(function(t){return allowed.indexOf(t.energy)>=0});
  var hidden=byH.length-list.length;
  var h=hidden?'<p class="note">Ховаю '+hidden+' складніших — зараз вони можуть зачекати.</p>':'';
  h+=list.length?list.map(taskHtml).join(''):'<div class="empty">'+(byH.length?'Для цього стану нічого не підходить.':'Немає задач у цьому списку.')+'</div>';
  var done=state.tasks.filter(function(t){return t.status==='COMPLETED'});
  if(done.length)h+='<details id="done-box"'+(ui.doneOpen?' open':'')+'><summary>Виконано ('+done.length+')</summary>'+done.map(taskHtml).join('')+'</details>';
  else ui.doneOpen=false;
  $('tasks').innerHTML=h;
}

function taskHtml(t){
  var d=t.status==='COMPLETED',open=ui.open[t.id];
  var sd=t.subtasks.filter(function(s){return s.isDone}).length;
  var dueBadge=t.dueDate?fmtDue(t.dueDate):'';
  var h='<div class="card task'+(d?' done':'')+'" id="t-'+t.id+'" data-id="'+t.id+'"><div class="row">'+
    '<button class="check" data-toggle="1" aria-label="Виконано">'+(d?'✓':'')+'</button>'+
    '<button class="ttl" data-open="1" aria-expanded="'+!!open+'">'+esc(t.title)+'</button>'+
    dueBadge+(t.subtasks.length?'<span class="prog">'+sd+'/'+t.subtasks.length+'</span>':'')+
    (d?'':(t.horizon==='THIS_WEEK'?'<button class="act mv" data-mv="TODAY">← На сьогодні</button>':'<button class="act mv" data-mv="THIS_WEEK">→ На тиждень</button>'))+
    '<span class="badge '+t.energy+'">'+E_LABEL[t.energy]+'</span>'+
    (d?'<button class="del" data-tdel="1" title="Видалити назавжди">🗑</button>':'')+'</div>';

  if(open){
    h+='<div class="detail"><textarea data-desc="1" placeholder="Опис або контекст">'+esc(t.description)+'</textarea>'+
      t.subtasks.map(function(s){return '<div class="sub'+(s.isDone?' d':'')+'" data-sid="'+s.id+'"><input type="checkbox" data-sdone="1"'+(s.isDone?' checked':'')+'><span>'+esc(s.title)+'</span><button class="x" data-sdel="1">✕</button></div>'}).join('')+
      '<input type="text" data-sadd="1" placeholder="Додати крок і натиснути Enter">'+
      '<div class="pair">'+
        '<select data-hor="1">'+Object.keys(H_LABEL).map(function(k){return '<option value="'+k+'"'+(k===t.horizon?' selected':'')+'>'+H_LABEL[k]+'</option>'}).join('')+'</select>'+
        '<select data-en="1">'+Object.keys(E_LABEL).map(function(k){return '<option value="'+k+'"'+(k===t.energy?' selected':'')+'>'+E_LABEL[k]+'</option>'}).join('')+'</select>'+
        '<input type="datetime-local" data-tdate="1" class="due-input" value="'+(t.dueDate||'')+'">'+
      '</div>'+
      '<div class="meta">'+t.tags.map(function(g){return '<span class="tag">#'+esc(g)+'</span>'}).join('')+'<span class="sp"></span>'+
      (t.status==='IN_PROGRESS'?'':(d?'':'<button class="act" data-prog="1">Почати</button>'))+
      '<button class="act" data-tarch="1">В архів</button></div></div>';
  }
  return h+'</div>';
}

function renderCourses(){
  var tabs=[['ACTIVE','В процесі'],['DONE','Завершені'],['ALL','Всі']];
  $('ctabs').innerHTML=tabsHtml(tabs,ui.cTab,'data-ct');
  var list=state.courses.filter(function(c){
    if(ui.cTab==='ACTIVE')return c.status==='ACTIVE';
    if(ui.cTab==='DONE')return c.status==='COMPLETED';
    return true;
  }).filter(function(c){return matchQ(c.title,c.tags)});
  if(!list.length){$('courses').innerHTML='<div class="empty">Немає курсів. Введіть <b>/course [назва]</b></div>';return}
  $('courses').innerHTML=list.map(function(c){
    var total=c.modules.length,done=c.modules.filter(function(m){return m.isDone}).length;
    var pct=total?Math.round((done/total)*100):0;
    var open=ui.open[c.id];
    var h='<div class="card task" data-id="'+c.id+'"><div class="row">'+
      '<button class="check" data-cdone="1">'+(c.status==='COMPLETED'?'✓':'')+'</button>'+
      '<button class="ttl" data-copen="1">'+esc(c.title)+'</button>'+
      '<span class="prog">'+done+'/'+total+' ('+pct+'%)</span></div>';
    if(open){
      h+='<div class="detail">'+
        c.modules.map(function(m){
          return '<div class="sub'+(m.isDone?' d':'')+'" data-mid="'+m.id+'"><input type="checkbox" data-mdone="1"'+(m.isDone?' checked':'')+'><span>'+esc(m.title)+'</span><button class="x" data-mdel="1">✕</button></div>';
        }).join('')+
        '<input type="text" data-madd="1" placeholder="Додати урок і натиснути Enter">'+
        '<div class="meta"><span class="sp"></span><button class="act" data-cdel="1">Видалити курс</button></div></div>';
    }
    return h+'</div>';
  }).join('');
}
function render(){renderThoughts();renderTasks();renderCourses()}
function T(id){return state.tasks.find(function(t){return t.id===id})}

$('ttabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.clrarch){
    var nT=state.thoughts.filter(function(t){return t.isArchived}).length;
    var nK=state.tasks.filter(function(t){return t.status==='ARCHIVED'}).length;
    if(!nT&&!nK){toast('Архів порожній');return}
    if(!confirm('Назавжди видалити з архіву: думок — '+nT+', задач — '+nK+'?'))return;
    state.thoughts=state.thoughts.filter(function(t){return !t.isArchived});
    state.tasks=state.tasks.filter(function(t){return t.status!=='ARCHIVED'});
    save();render();toast('Архів очищено');return;
  }
  if(b.dataset.tt)ui.tTab=b.dataset.tt;
  if(b.dataset.clear)ui.tag=null;
  if(b.dataset.tsort)ui.tSort=(ui.tSort==='desc')?'asc':'desc';
  render();
});

$('thoughts').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tag){ui.tag=b.dataset.tag;render();return}
  if(b.dataset.goto){switchView('tasks');ui.hTab='ALL';ui.q='';$('q').value='';ui.open[b.dataset.goto]=true;render();var el=$('t-'+b.dataset.goto);if(el)el.scrollIntoView({block:'center'});return}
  var card=b.closest('.thought'),th=state.thoughts.find(function(x){return x.id===card.dataset.id});if(!th)return;
  if(b.dataset.arch){th.isArchived=!th.isArchived}
  if(b.dataset.moveto){
    var cat=b.dataset.moveto,idx=th.tags.indexOf(cat);
    if(idx>=0){th.tags.splice(idx,1);toast('Видалено з "'+cat+'"')}
    else{th.tags=th.tags.filter(function(x){return x!=='ідея'&&x!=='рефлексія'});th.tags.push(cat);toast('Переміщено в "'+cat+'"')}
    save();render();return;
  }
  if(b.dataset.cfg){ui.cfg=ui.cfg===th.id?null:th.id;render();return}
  if(b.dataset.cancel){ui.cfg=null;render();return}
  if(b.dataset.conv){var r=convertThought({thoughtId:th.id});toast(r.success?'Задачу створено':r.error)}
  if(b.dataset.cok){
    var c=function(k){return card.querySelector('[data-c="'+k+'"]')};
    var r2=convertThought({thoughtId:th.id,customTitle:c('title').value,description:c('desc').value.trim()||undefined,energy:c('en').value,horizon:c('hor').value,archiveThought:c('arch').checked});
    if(!r2.success){toast(r2.error);return}
    ui.cfg=null;toast('Задачу створено');
  }
  save();render();
});

$('tasks').addEventListener('toggle',function(e){if(e.target.id==='done-box')ui.doneOpen=e.target.open},true);
$('htabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;ui.hTab=b.dataset.ht;render()});
$('tasks').addEventListener('click',function(e){
  var card=e.target.closest('.task');if(!card)return;var t=T(card.dataset.id);if(!t)return;
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.open){ui.open[t.id]=!ui.open[t.id];renderTasks();return}
  if(b.dataset.toggle){var d=t.status==='COMPLETED';t.status=d?'TODO':'COMPLETED';t.completedAt=d?null:Date.now();if(d&&t.horizon==='TODAY'&&activeToday()>LIMIT){t.horizon='THIS_WEEK'}}
  if(b.dataset.prog){t.status='IN_PROGRESS'}
  if(b.dataset.mv){var to=b.dataset.mv;t.horizon=(to==='TODAY')?pickHorizon('TODAY'):to;toast(t.horizon==='THIS_WEEK'?'Переміщено на тиждень':'Повернуто на сьогодні')}
  if(b.dataset.tdel){state.tasks=state.tasks.filter(function(x){return x.id!==t.id});save();render();toast('Видалено');return}
  if(b.dataset.tarch){t.status='ARCHIVED';toast('Заархівовано')}
  if(b.dataset.sdel){var sid=b.closest('.sub').dataset.sid;t.subtasks=t.subtasks.filter(function(s){return s.id!==sid})}
  save();render();
});
$('tasks').addEventListener('change',function(e){
  var card=e.target.closest('.task');if(!card)return;var t=T(card.dataset.id);if(!t)return;
  if(e.target.dataset.sdone){var s=t.subtasks.find(function(x){return x.id===e.target.closest('.sub').dataset.sid});s.isDone=e.target.checked}
  else if(e.target.dataset.hor){var v=e.target.value;if(v==='TODAY'&&t.horizon!=='TODAY')v=pickHorizon(v);t.horizon=v}
  else if(e.target.dataset.en){t.energy=e.target.value}
  else if(e.target.dataset.desc){t.description=e.target.value;save();return}
  else if(e.target.dataset.tdate){t.dueDate=e.target.value||null}
  else return;
  save();render();
});
$('due-quick-bar').addEventListener('click',function(e){
  var btn=e.target.closest('button');if(!btn||!btn.dataset.setdue)return;
  var action=btn.dataset.setdue,inpDue=$('inp-due');
  if(action==='clear'){inpDue.value='';return}
  var d=new Date();
  if(action==='today')d.setHours(18,0,0,0);
  else if(action==='tomorrow'){d.setDate(d.getDate()+1);d.setHours(12,0,0,0)}
  var pad=function(n){return String(n).padStart(2,'0')};
  inpDue.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
});
$('tasks').addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target.dataset.sadd)return;e.preventDefault();
  var card=e.target.closest('.task'),t=T(card.dataset.id),v=e.target.value.trim();if(!t||!v)return;
  t.subtasks.push({id:uid(),title:v,isDone:false,order:t.subtasks.length});save();renderTasks();
  var el=document.querySelector('#t-'+t.id+' [data-sadd]');if(el)el.focus();
});

$('ctabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;ui.cTab=b.dataset.ct;renderCourses()});
$('courses').addEventListener('click',function(e){
  var card=e.target.closest('.card');if(!card)return;
  var c=state.courses.find(function(x){return x.id===card.dataset.id});if(!c)return;
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.copen){ui.open[c.id]=!ui.open[c.id];renderCourses();return}
  if(b.dataset.cdone){c.status=c.status==='COMPLETED'?'ACTIVE':'COMPLETED';save();renderCourses();return}
  if(b.dataset.cdel){state.courses=state.courses.filter(function(x){return x.id!==c.id});save();renderCourses();return}
  if(b.dataset.mdel){var mid=b.closest('.sub').dataset.mid;c.modules=c.modules.filter(function(m){return m.id!==mid});save();renderCourses();return}
});
$('courses').addEventListener('change',function(e){
  var card=e.target.closest('.card');if(!card)return;
  var c=state.courses.find(function(x){return x.id===card.dataset.id});if(!c)return;
  if(e.target.dataset.mdone){
    var mid=e.target.closest('.sub').dataset.mid;
    var m=c.modules.find(function(x){return x.id===mid});if(m)m.isDone=e.target.checked;
    save();renderCourses();
  }
});
$('courses').addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target.dataset.madd)return;e.preventDefault();
  var card=e.target.closest('.card');if(!card)return;
  var c=state.courses.find(function(x){return x.id===card.dataset.id});if(!c)return;
  var val=e.target.value.trim();if(!val)return;
  c.modules.push({id:uid(),title:val,isDone:false});
  save();renderCourses();
});

load();switchView('tasks');render();preview();inp.focus();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('PWA Service Worker зареєстровано'))
      .catch((err) => console.error('Помилка реєстрації SW:', err));
  });
}
